name: imagen
description: AI-powered image generation Flutter app.
publish_to: "none"

version: 2.5.0+1

environment:
  sdk: ">=3.0.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  binance_pay: ^0.0.2
  cloud_firestore: ^4.13.3
  file_picker: ^10.2.1
  flutter_bloc: ^8.1.2
  flutter_svg: ^2.0.9
  equatable: ^2.0.5
  flutter_archive: ^6.0.3

  flutter_localizations:
    sdk: flutter

  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  flutter_native_splash: ^2.3.9
  flutter_stripe: ^9.4.0
  get: ^4.6.6
  get_it: ^7.2.0
  google_sign_in: ^6.1.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.4.0
  intl: ^0.20.2
  logger: ^2.0.2+1
  lottie: ^3.1.0  # Updated to fix archive conflict
  package_info_plus: ^4.1.0
  path_provider: ^2.0.9
  permission_handler: ^11.3.1
  provider: ^6.0.5
  purchases_flutter: ^9.1.0
  rate_my_app: ^2.3.2
  sign_in_button: ^3.2.0
  sign_in_with_apple: ^7.0.1
  share_plus: ^11.0.0
  upgrader: ^8.1.0
  url_launcher: ^6.0.20
  uuid: ^3.0.4
  http_parser: ^4.0.2
  gal: ^2.3.2

dependency_overrides:
  stripe_android: ^11.5.0
  archive: ^3.4.10  # Force the correct archive version

dev_dependencies:
  flutter_launcher_icons: "^0.13.1"
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/imagen_black_bg.png"
  background_color: "#ffffff"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Bold.ttf
    - family: DeliciousHandrawn
      fonts:
        - asset: assets/fonts/DeliciousHandrawn-Regular.ttf
    - family: Gotham
      fonts:
        - asset: assets/fonts/Gotham-Black.otf
    - family: Alva
      fonts:
        - asset: assets/fonts/ALVA-Regular.ttf

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#080812"
  image: assets/icons/imagen_black.png
  android_12:
    color: "#ffffff"
    color_dark: "#080812"
    image: assets/icons/imagen_black_splash.png
    fullscreen: true
  web: false